<!-- ╔══════════════════════════════════════════════════════════════════════╗
     ║  1) THEMEN-BLOCK  –  hier steht ALLES, was zum Thema gehört          ║
     ║  (Aufgaben, Schwierigkeit pro Level, Antwortprüfung, Hilfestellung)  ║
     ╚══════════════════════════════════════════════════════════════════════╝ -->
<script>
/* =========================================================================
   THEMA: Masseinheiten Trainer – Länge, Volumen, Gewicht, Zeit, Fläche umrechnen

   Aufbau wie beim Komma Trainer: Nur dieser Block gehört zum Thema.
   Die ENGINE weiter unten (Oberfläche, Levels/XP, Cookies, Achievements,
   Zeitrennen, Speichern/Laden) ist für alle Trainer gleich.

   SCHNITTSTELLE – das muss TOPIC liefern:
     id, title, subtitle, levels {name,icon,…}, raceLevel, medals, raceRating (optional), css
     raceOption  (optional) feste Auswahl für das Zeitrennen (hier 'mix' = alle Kategorien gemischt)
     options     (optional) Auswahlliste über der Aufgabe: {choices:[{v,label}], default}
                 Die Engine zeigt sie an, speichert die Wahl und übergibt sie als 2. Argument an makeTask.
     makeTask(l, opt) -> Objekt {text, answer, ...}   neue Aufgabe für Level-Index l
     check(raw, task) -> true/false
     help(task)  -> HTML-Text (erscheint ab dem 2. Fehlversuch)
   ========================================================================= */
const TOPIC=(function(){

  /* ---------- Einheiten ----------
     Jede Einheit: n = Name, f = Grösse in der kleinsten Einheit der Kategorie (ganze Zahl, daher exakt rechnen).
     Reihenfolge: von klein nach gross. Der Abstand der Positionen ist die Anzahl "Einheiten daneben". */
  const CATS={
    laenge :{name:'Länge',   icon:'📏',power:true, units:[{n:'mm',f:1n},{n:'cm',f:10n},{n:'dm',f:100n},{n:'m',f:1000n},{n:'km',f:1000000n}]},
    volumen:{name:'Volumen', icon:'🧴',power:true, units:[{n:'ml',f:1n},{n:'cl',f:10n},{n:'dl',f:100n},{n:'l',f:1000n},{n:'hl',f:100000n}]},
    gewicht:{name:'Gewicht', icon:'⚖️',power:true, maxDist:2, dist2From:3, units:[{n:'mg',f:1n},{n:'g',f:1000n},{n:'kg',f:1000000n},{n:'t',f:1000000000n}]},
    zeit   :{name:'Zeit',    icon:'⏱️',power:false,units:[{n:'s',f:1n},{n:'min',f:60n},{n:'h',f:3600n},{n:'d',f:86400n}]},
    flaeche:{name:'Fläche',  icon:'🟦',power:true, units:[{n:'mm²',f:1n},{n:'cm²',f:100n},{n:'dm²',f:10000n},{n:'m²',f:1000000n},{n:'a',f:100000000n,lv:3},{n:'ha',f:10000000000n,lv:3},{n:'km²',f:1000000000000n,lv:3}]}   /* lv = erstes Level (Index), in dem die Einheit vorkommt: Are, Hektare, km² erst ab Level 4 */
  };
  const CAT_KEYS=Object.keys(CATS);
  const MIX_KEYS=CAT_KEYS.filter(k=>k!=='flaeche');   /* "Gemischt" (und Zeitrennen) ohne Fläche */

  /* ---------- Schwierigkeit pro Level ----------
     whole   : true = nur ganze Zahlen; sonst ca. 30 % ganze Zahlen, der Rest Dezimalzahlen
     digits  : [kleinste, grösste] Anzahl Ziffern der Zahl in der Aufgabe (es werden höchstens 2 weniger als das Maximum verwendet)
     dist    : [kleinster, grösster] Abstand der beiden Einheiten (1 = direkt daneben)
     noComma : true = Ergebnis ist immer eine ganze Zahl
     intMax / decMax : höchstens so viele Stellen vor / nach dem Komma im Ergebnis */
  const LEVELS=[
    {name:'Anfänger',       icon:'👶',whole:true,digits:[1,2],dist:[1,1],noComma:true,intMax:6,decMax:0},
    {name:'Fortgeschritten',icon:'🛹',whole:true,digits:[1,3],dist:[1,1],intMax:6,decMax:3},
    {name:'Profi',          icon:'😎',whole:true,digits:[1,4],dist:[1,2],intMax:7,decMax:6},
    {name:'Experte',        icon:'🚀',          digits:[2,4],dist:[1,2],intMax:7,decMax:6},
    {name:'Meister',        icon:'👑',          digits:[3,5],dist:[1,9],intMax:8,decMax:8}
  ];
  const WHOLE_SHARE=0.3;   /* ab Level 4: ca. 30 % ganze Zahlen */

  /* ---------- Zahlen als Text (keine Rundungsfehler) ---------- */
  function randDigit(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

  function digitCount(lv,whole){
    let hi=lv.digits[1],lo=lv.digits[0];
    let min=Math.max(lo,hi-2);
    if(!whole)min=Math.max(2,min);   /* Dezimalzahl braucht mind. 2 Ziffern */
    return randDigit(min,hi);
  }
  function randDecimal(k){
    let dp=randDigit(1,Math.min(2,k-1)),ip=k-dp,i='',d='';   /* höchstens 2 Nachkommastellen */
    for(let x=0;x<ip;x++)i+=(x===0&&ip>1)?randDigit(1,9):randDigit(0,9);
    for(let x=0;x<dp;x++)d+=(x===dp-1)?randDigit(1,9):randDigit(0,9);
    return i+'.'+d;
  }
  function randWhole(k){   /* in der Hälfte der Fälle mit Endnull (20, 450 …) */
    let s='';
    for(let x=0;x<k;x++)s+=(x===0)?randDigit(1,9):randDigit(0,9);
    if(k>=2&&Math.random()<0.5)s=s.slice(0,-1)+'0';
    return s;
  }
  function randNum(lv){
    let whole=lv.whole||Math.random()<WHOLE_SHARE;
    let k=digitCount(lv,whole);
    return whole?randWhole(k):randDecimal(k);
  }
  function normalize(s){
    let p=s.split('.');
    let i=(p[0]||'').replace(/^0+/,'')||'0';
    let d=(p[1]||'').replace(/0+$/,'');
    return d?i+'.'+d:i;
  }
  function normalizeInput(raw){
    let s=raw.replace(/[\s'’]/g,'').replace(',','.');
    if(!/^\d*\.?\d*$/.test(s)||!/\d/.test(s))return null;
    return normalize(s);
  }

  /* ---------- Exakt umrechnen (BigInt, kein Gleitkomma) ----------
     Ergebnis = n · fA / fB. Gibt null zurück, wenn das Ergebnis kein endlicher Dezimalbruch ist (z. B. 1 min = 1/60 h). */
  function gcd(a,b){while(b){let t=a%b;a=b;b=t;}return a;}
  function convert(n,fA,fB){
    let p=n.split('.'),d=p[1]?p[1].length:0;
    let num=BigInt(p[0]+(p[1]||''))*fA;
    if(num===0n)return '0';
    let den=fB*(10n**BigInt(d));
    let g=gcd(num,den);num/=g;den/=g;
    let rest=den,a=0,b=0;
    while(rest%2n===0n){rest/=2n;a++;}
    while(rest%5n===0n){rest/=5n;b++;}
    if(rest!==1n)return null;
    let dec=Math.max(a,b);
    let scaled=num*(10n**BigInt(dec))/den;
    let s=scaled.toString();
    if(dec>0){
      while(s.length<=dec)s='0'+s;
      s=s.slice(0,-dec)+'.'+s.slice(-dec);
    }
    return normalize(s);
  }

  /* ---------- Zeit: eigener Aufgaben-Generator ----------
     Bei der Zeit wird nicht das Komma verschoben, sondern mit 60 und 24 gerechnet. Darum bewusst kleine Zahlen,
     die pro Level um höchstens 2 wachsen. Keine Dezimalzahlen ausser bei Stunden (fr = erlaubte Bruchteile) und ab Level 4 bei Tagen (frD: nur .5; stepH = Stunden-Schritt bei h→d).
       reihe60 : höchste Zahl in der 60er-Reihe: h→min bis so viele Stunden, min→h bis so viele mal 60 Minuten,
                 s→min bis so viele mal 60 Sekunden, min→s bis so viele Minuten
       tage    : d→h bis so viele Tage, h→d bis so viele mal 24 Stunden
       sh      : (ab Level 4) gelegentlich s↔h (zwei Schritte), ganz einfach (1–3 Stunden) */
  const ZEIT=[
    {reihe60:2, tage:2, fr:[0],               frD:[0],     step:60, stepH:24},                 /* Level 1: 2 h = 120 min, 2 d = 48 h; nur ganze Zahlen */
    {reihe60:3, tage:3, fr:[0,0.5],           frD:[0],     step:30, stepH:24},                 /* Level 2: 3 h = 180 min, 3 d = 72 h; Stunden auch mit .5 */
    {reihe60:5, tage:5, fr:[0,0.25,0.5,0.75], frD:[0],     step:15, stepH:24},                 /* Level 3: Stunden auch mit .25 / .75 */
    {reihe60:7, tage:7, fr:[0,0.25,0.5,0.75], frD:[0,0.5], step:15, stepH:12,sh:true},         /* Level 4: Tage erstmals auch mit .5; erstmals zwei Schritte (s↔h) */
    {reihe60:10,tage:10,fr:[0,0.25,0.5,0.75], frD:[0,0.5], step:15, stepH:12,sh:true}          /* Level 5: 10 h = 600 min, 10 d = 240 h; mal s↔h */
  ];
  function genZeit(l,pair,avoidN){
    let c=ZEIT[l],u=CATS.zeit.units;
    const DIRS=[[0,1],[1,0],[1,2],[2,1],[2,3],[3,2]];   /* s→min, min→s, min→h, h→min, h→d, d→h */
    for(let tries=0;tries<2000;tries++){
      let pr=pair;
      if(!pr)pr=(c.sh&&Math.random()<0.1)?(Math.random()<0.5?[0,2]:[2,0]):DIRS[Math.floor(Math.random()*DIRS.length)];
      let n;
      switch(pr[0]+''+pr[1]){
        case '01':n=String(60*randDigit(1,c.reihe60));break;                         /* 60, 120, … Sekunden */
        case '10':n=String(randDigit(1,c.reihe60));break;                            /* Minuten */
        case '12':n=String(c.step*randDigit(1,c.reihe60*60/c.step));break;           /* Minuten, die ganze Stunden bzw. .5/.25/.75 ergeben */
        case '21':{let h=randDigit(0,c.reihe60)+c.fr[Math.floor(Math.random()*c.fr.length)];if(h<=0||h>c.reihe60)continue;n=String(h);break;}
        case '23':n=String(c.stepH*randDigit(1,c.tage*24/c.stepH));break;            /* Stunden, die ganze Tage bzw. .5/.25/.75 ergeben */
        case '32':{let d=randDigit(0,c.tage)+c.frD[Math.floor(Math.random()*c.frD.length)];if(d<=0||d>c.tage)continue;n=String(d);break;}   /* Tage, auch mit Bruchteil */
        case '02':n=String(3600*randDigit(1,3));break;                               /* 3600, 7200, 10800 Sekunden */
        case '20':n=String(randDigit(1,3));break;                                    /* 1–3 Stunden */
        default:continue;
      }
      if(n===avoidN)continue;
      let res=convert(n,u[pr[0]].f,u[pr[1]].f);
      if(res===null)continue;
      return {n:n,res:res,iA:pr[0],iB:pr[1]};
    }
    return {n:'1',res:'60',iA:2,iB:1};
  }

  /* ---------- Aufgabe erzeugen ---------- */
  /* Erzeugt Zahl n und Ergebnis für Kategorie cat; pair = [iA,iB] erzwingt ein Einheitenpaar (für Hilfsbeispiele) */
  function gen(l,cat,pair,avoidN){
    if(cat==='zeit')return genZeit(l,pair,avoidN);
    let lv=LEVELS[l],units=CATS[cat].units;
    let pairs=[];
    if(pair)pairs.push(pair);
    else for(let i=0;i<units.length;i++)for(let j=0;j<units.length;j++){
      let d=Math.abs(i-j);
      if((units[i].lv||0)>l||(units[j].lv||0)>l)continue;   /* Einheit noch nicht freigeschaltet */
      let maxD=Math.min(lv.dist[1],CATS[cat].maxDist||99);
      if(CATS[cat].dist2From!==undefined&&l<CATS[cat].dist2From)maxD=1;   /* Gewicht: bis Level 3 nur 1 Schritt, ab Level 4 höchstens 2 (mg→kg, g→t), mg→t gibt es nie */
      if(d<lv.dist[0]||d>maxD)continue;
      /* ohne Komma im Ergebnis: in eine grössere Einheit geht es nur mit Vielfachen, die in die Zahl passen (mind. 4 Möglichkeiten) */
      if(lv.noComma&&units[j].f>units[i].f){
        let r=Number(units[j].f/units[i].f);
        if(Math.floor((Math.pow(10,lv.digits[1])-1)/r)<4)continue;
      }
      pairs.push([i,j]);
    }
    for(let tries=0;tries<20000;tries++){
      let pr=pairs[Math.floor(Math.random()*pairs.length)];
      let A=units[pr[0]],B=units[pr[1]],n;
      if(lv.noComma&&B.f>A.f){
        let r=Number(B.f/A.f),kmax=Math.floor((Math.pow(10,lv.digits[1])-1)/r);
        if(kmax<1)continue;
        n=String(r*randDigit(1,kmax));
      }else n=randNum(lv);
      if(n===avoidN)continue;
      let res=convert(n,A.f,B.f);
      if(res===null)continue;
      let p=res.split('.');
      if(lv.noComma&&p[1])continue;
      if(p[0].length>lv.intMax||(p[1]?p[1].length:0)>lv.decMax)continue;
      return {n:n,res:res,iA:pr[0],iB:pr[1]};
    }
    let u=pair||[1,0];   /* Notlösung, sollte nie vorkommen */
    return {n:'1',res:convert('1',units[u[0]].f,units[u[1]].f)||'1',iA:u[0],iB:u[1]};
  }

  function makeTask(l,opt){
    let cat=CATS[opt]?opt:MIX_KEYS[Math.floor(Math.random()*MIX_KEYS.length)];
    let g=gen(l,cat);
    let units=CATS[cat].units,A=units[g.iA],B=units[g.iB];
    return {
      text:CATS[cat].icon+' '+g.n+' '+A.n+' = ? '+B.n,
      answer:g.res,n:g.n,cat:cat,iA:g.iA,iB:g.iB,level:l,
      shift:String(A.f).length-String(B.f).length,   /* Kommaverschiebung (nur bei Zehnerpotenzen) */
      ratio:Number(A.f>B.f?A.f/B.f:B.f/A.f)
    };
  }

  function check(raw,task){
    let v=normalizeInput(raw);
    return v!==null&&v===task.answer;
  }

  /* ---------- Hilfestellung ---------- */
  function helpNumber(n){   /* gleich viele Stellen vor und nach dem Komma wie die Aufgabe */
    let p=n.split('.'),ni=p[0].length,nd=p[1]?p[1].length:0,s;
    do{
      if(nd===0)s=randWhole(ni);
      else{
        let ip='',dp='';
        for(let i=0;i<ni;i++)ip+=(i===0)?randDigit(1,9):randDigit(0,9);
        for(let i=0;i<nd;i++)dp+=(i===nd-1)?randDigit(1,9):randDigit(0,9);
        s=ip+'.'+dp;
      }
    }while(s===n);
    return s;
  }
  function shiftView(s,k){   /* Zahl vorher/nachher als HTML, Komma farbig, Stellen gelb */
    let p=s.split('.'),digs=(p[0]+(p[1]||'')).split(''),p0=p[0].length;
    let lo=k>0?p0:p0+k,hi=k>0?p0+k:p0;
    const X=c=>'<span class="cross">'+c+'</span>';
    let from='';
    for(let i=0;i<=digs.length;i++){
      if(i===p0)from+='<span class="cOld">.</span>';
      if(i<digs.length)from+=(i>=lo&&i<hi)?X(digs[i]):digs[i];
    }
    let items=digs.map((c,i)=>({c:c,x:i>=lo&&i<hi}));
    let pos=p0+k,lead='';
    if(pos<=0){for(let i=0;i<-pos;i++)items.unshift({c:'0',x:true});pos=0;lead='0';}
    else{while(items.length<pos)items.push({c:'0',x:true});}
    while(items.length>pos&&items[items.length-1].c==='0')items.pop();
    let to=lead;
    for(let i=0;i<=items.length;i++){
      if(i===pos)to+='<span class="cNew">.</span>';
      if(i<items.length)to+=items[i].x?X(items[i].c):items[i].c;
    }
    return {from:from,to:to};
  }
  function ladder(cat,iA,iB,l){   /* Umrechnungsleiter: Einheiten mit Faktor dazwischen, Weg gelb */
    let u=CATS[cat].units,lo=Math.min(iA,iB),hi=Math.max(iA,iB),h='<div class="ladder">';
    for(let i=0;i<u.length;i++){
      if((u[i].lv||0)>l)break;   /* nur Einheiten zeigen, die in diesem Level vorkommen */
      h+='<span class="u'+(i===iA?' uA':(i===iB?' uB':''))+'">'+u[i].n+'</span>';
      if(i<u.length-1&&(u[i+1].lv||0)<=l){
        /* zwei Pfeile: oben → in die grössere Einheit (:Faktor), unten ← in die kleinere Einheit (·Faktor); der benötigte Weg leuchtet gelb */
        let f=u[i+1].f/u[i].f,onPath=(i>=lo&&i<hi),up=iA<iB;
        h+='<span class="lk"><span class="a'+(onPath&&up?' on':'')+'">:'+f+'<br><b>→</b></span><span class="a'+(onPath&&!up?' on':'')+'"><b>←</b><br>·'+f+'</span></span>';
      }
    }
    return h+'</div>';
  }

  function help(t){
    let c=CATS[t.cat],u=c.units,A=u[t.iA],B=u[t.iB];
    let up=t.iB>t.iA,steps=Math.abs(t.iA-t.iB);
    let h='<b>Umrechnungsleiter:</b>'+ladder(t.cat,t.iA,t.iB,t.level)
      +'<br>'
      +'Du gehst von <span class="tA">'+A.n+'</span> nach <span class="tB">'+B.n+'</span>: '+steps+' Schritt'+(steps>1?'e':'')+' zu einer '
      +(up?'<b>grösseren</b> Einheit. Du brauchst weniger davon, die Zahl wird <b>kleiner</b> (÷).'
          :'<b>kleineren</b> Einheit. Du brauchst mehr davon, die Zahl wird <b>grösser</b> (×).')+'<br><br>';
    if(c.power){
      let k=Math.abs(t.shift),a=helpNumber(t.n),v=shiftView(a,t.shift);
      h+='Faktor insgesamt: <b>'+(up?'÷ ':'× ')+Math.pow(10,k)+'</b> → das Komma wandert um <b>'+k+'</b> Stelle'+(k>1?'n':'')+' nach <b>'+(t.shift>0?'rechts':'links')+'</b>.<br><br>'
        +'<b>Hilfsbeispiel:</b><div class="helpcalc">'+v.from+' '+A.n+' = '+v.to+' '+B.n+'</div>'
        +'<div class="legend"><span class="cOld">Komma vorher</span> · <span class="cNew">Komma nachher</span> · <span class="cross">Stellen, über die das Komma gewandert ist</span></div>';
    }else{
      let ex=gen(t.level,t.cat,[t.iA,t.iB],t.n);
      h+='Faktor insgesamt: <b>'+(up?'÷ ':'× ')+t.ratio+'</b>'+(steps>1?' (':'')+(steps>1?(function(){let f=[];let a=Math.min(t.iA,t.iB),b=Math.max(t.iA,t.iB);for(let i=a;i<b;i++)f.push(String(u[i+1].f/u[i].f));return f.join(' · ');})():'')+(steps>1?')':'')+'.<br><br>'
        +'<b>Hilfsbeispiel:</b><div class="helpcalc">'+ex.n+' '+A.n+' = '+ex.res+' '+B.n+'</div>'
        +'<div class="legend">Rechnung: '+ex.n+' '+(up?'÷':'×')+' '+t.ratio+' = '+ex.res+'</div>'
        +((t.iA+t.iB===3&&Math.abs(t.iA-t.iB)===1)?'<div class="legend">Tipp: 0.25 h = 15 min · 0.5 h = 30 min · 0.75 h = 45 min</div>':'')
        +((t.iA+t.iB===5&&t.level>=3)?'<div class="legend">Tipp: 0.5 d = 12 h</div>':'');
    }
    return h;
  }

  return {
    id:'masseinheiten',
    title:'Masseinheiten Trainer',
    subtitle:'Länge, Volumen, Gewicht, Zeit und Fläche umrechnen',
    levels:LEVELS,
    raceLevel:2,   /* Zeitrennen: immer Aufgaben von Level 3 (Profi) */
    raceOption:'mix',   /* Zeitrennen: immer gemischte Kategorien, unabhängig von der Auswahl */
    raceRating:[{min:9,icon:'🤖',name:'Maschine'},{min:6,icon:'🏃',name:'Sprinter'},{min:3,icon:'🚶',name:'Spaziergänger'},{min:1,icon:'🐌',name:'Schnecke'}],
    medals:['🥉 Bronze-Umrechner','🥈 Silber-Umrechner','🥇 Gold-Umrechner','💠 Platin-Umrechner'],
    options:{
      choices:CAT_KEYS.map(k=>({v:k,label:CATS[k].icon+' '+CATS[k].name})).concat([{v:'mix',label:'🎲 Gemischt (ohne Fläche)'}]),
      default:'laenge'
    },
    css:'.helpcalc{font-size:26px;font-weight:bold;margin:12px 0 6px}.cOld{color:#d32f2f;font-weight:bold}.cNew{color:#2e7d32;font-weight:bold}.helpcalc .cOld,.helpcalc .cNew{font-size:1.5em}.cross{background:#fff176;border-radius:4px;padding:0 2px}.legend{font-size:14px;color:#444}.ladder{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin:10px 0}.u{border:2px solid #90a4ae;border-radius:8px;padding:4px 8px;font-weight:bold;background:#fff}.u.uA{background:#c8e6c9;border-color:#2e7d32}.u.uB{background:#ffcdd2;border-color:#d32f2f}.tA,.tB{font-weight:bold;border-radius:5px;padding:1px 6px}.tA{background:#c8e6c9;color:#1b5e20}.tB{background:#ffcdd2;color:#b71c1c}span.uA{background:#ffcdd2;border-radius:4px;padding:0 4px}span.uB{background:#c8e6c9;border-radius:4px;padding:0 4px}.lk{display:inline-flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:#888;padding:0 3px;line-height:1.05}.lk .a{display:block;text-align:center;padding:1px 4px;border-radius:6px}.lk .a b{font-size:17px}.lk .a.on{background:#fff176;color:#000;font-weight:bold}',
    makeTask:makeTask,
    check:check,
    help:help
  };
})();
</script>

<!-- ╔══════════════════════════════════════════════════════════════════════╗
     ║  2) SPIEL-BLOCK  –  themenunabhängig (Belohnung für Cookies)         ║
     ║  Schnittstelle: GAME.name, GAME.cost (Cookies pro Runde),            ║
     ║  GAME.start(container, onEnd(punkte)), GAME.stop()                   ║
     ║  Zum Austauschen des Spiels nur diesen Block ersetzen.               ║
     ╚══════════════════════════════════════════════════════════════════════╝ -->
<script>
const GAME=(function(){
  /* Flappy Bird (einfache Version): Leertaste = flattern, durch die Lücken fliegen */
  const W=360,H=520,GROUND=60,BX=90,R=13,GAP=150,PW=56,SPACING=210,SPEED=150,GRAV=1500,FLAP=-400,MAXSTEP=0.05,SCALE=1.2,TRIES=3,SPEED_UP=1.2,SPEED_EVERY=10,SPEED_MAX=3;   /* alle 10 Röhren 20 % schneller, höchstens Faktor 3 */
  function speedFactor(score){return Math.min(SPEED_MAX,Math.pow(SPEED_UP,Math.floor(score/SPEED_EVERY)));}
  function rnd(a,b){return a+Math.random()*(b-a);}

  function addPipe(s){
    let lo=GAP/2+40,hi=H-GROUND-GAP/2-40;
    let c=Math.max(lo,Math.min(hi,s.lastCenter+rnd(-140,140)));   /* nie zu weit auseinander: immer machbar */
    s.lastCenter=c;
    s.pipes.push({x:s.nextX,c:c,passed:false});
    s.nextX+=SPACING;
  }
  function newState(){
    let s={bird:{y:H/2-30,v:0},pipes:[],score:0,time:0,deadTime:0,phase:'ready',lastCenter:(H-GROUND)/2,nextX:W+60};
    addPipe(s);
    return s;
  }
  function flap(s){
    if(s.phase==='ready')s.phase='play';
    if(s.phase==='play')s.bird.v=FLAP;
  }
  function hitRect(cx,cy,r,rx,ry,rw,rh){
    let nx=Math.max(rx,Math.min(cx,rx+rw)),ny=Math.max(ry,Math.min(cy,ry+rh));
    let dx=cx-nx,dy=cy-ny;
    return dx*dx+dy*dy<r*r;
  }
  function die(s){s.phase='dead';s.deadTime=0;}
  function step(s,dt){
    s.time+=dt;
    let b=s.bird;
    if(s.phase==='ready'){b.y=H/2-30+Math.sin(s.time*4)*6;return;}
    if(s.phase==='dead'){
      s.deadTime+=dt;
      b.v+=GRAV*dt;b.y=Math.min(H-GROUND-R,b.y+b.v*dt);
      return;
    }
    b.v+=GRAV*dt;b.y+=b.v*dt;
    if(b.y<R){b.y=R;if(b.v<0)b.v=0;}                  /* Decke bremst nur, tötet nicht */
    let v=SPEED*speedFactor(s.score);
    s.pipes.forEach(p=>{p.x-=v*dt;});
    s.nextX-=v*dt;
    while(s.nextX<=W+20)addPipe(s);
    s.pipes=s.pipes.filter(p=>p.x>-PW-10);
    let r=R-2;                                          /* etwas nachsichtig */
    for(const p of s.pipes){
      if(hitRect(BX,b.y,r,p.x,0,PW,p.c-GAP/2)||hitRect(BX,b.y,r,p.x,p.c+GAP/2,PW,H-GROUND-(p.c+GAP/2))){die(s);return;}
      if(!p.passed&&p.x+PW<BX-R){p.passed=true;s.score++;}
    }
    if(b.y+R>=H-GROUND){b.y=H-GROUND-R;die(s);}
  }

  function draw(ctx,s){
    let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#7ec8f2');g.addColorStop(1,'#d8f0ff');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    s.pipes.forEach(p=>{
      ctx.fillStyle='#4caf50';
      ctx.fillRect(p.x,0,PW,p.c-GAP/2);
      ctx.fillRect(p.x,p.c+GAP/2,PW,H-GROUND-(p.c+GAP/2));
      ctx.fillStyle='#388e3c';
      ctx.fillRect(p.x-4,p.c-GAP/2-18,PW+8,18);
      ctx.fillRect(p.x-4,p.c+GAP/2,PW+8,18);
    });
    ctx.fillStyle='#d7b46a';ctx.fillRect(0,H-GROUND,W,GROUND);
    ctx.fillStyle='#8bc34a';ctx.fillRect(0,H-GROUND,W,8);
    let b=s.bird;
    ctx.save();ctx.translate(BX,b.y);ctx.rotate(Math.max(-0.5,Math.min(1.1,b.v/600)));
    ctx.fillStyle='#ffd54f';ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff9800';ctx.beginPath();ctx.moveTo(R-2,-2);ctx.lineTo(R+9,2);ctx.lineTo(R-2,6);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(4,-4,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(5,-4,2,0,Math.PI*2);ctx.fill();
    ctx.restore();
    ctx.fillStyle='#fff';ctx.strokeStyle='#333';ctx.lineWidth=4;ctx.font='bold 40px Arial';ctx.textAlign='center';
    ctx.strokeText(s.score,W/2,60);ctx.fillText(s.score,W/2,60);
    if(s.phase==='ready'){
      ctx.font='bold 22px Arial';ctx.lineWidth=3;
      ctx.strokeText('Leertaste zum Starten',W/2,H/2+60);ctx.fillText('Leertaste zum Starten',W/2,H/2+60);
    }
  }

  let run=null;
  function stop(){
    if(!run)return;
    cancelAnimationFrame(run.raf);
    document.removeEventListener('keydown',run.onKey);
    run=null;
  }
  function start(root,onEnd){
    stop();
    root.innerHTML='';
    let K=Math.max(0.7,Math.min(SCALE,(window.innerHeight-190)/H,(window.innerWidth-60)/W));   /* Darstellung 1.2x gross, auf kleinen Bildschirmen angepasst */
    let canvas=document.createElement('canvas');canvas.width=Math.round(W*K);canvas.height=Math.round(H*K);
    root.appendChild(canvas);
    let ctx=canvas.getContext('2d');
    if(ctx)ctx.setTransform(K,0,0,K,0,0);
    let s=newState();
    let r={raf:0,ended:false,last:0};
    r.onKey=e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();flap(s);}};
    document.addEventListener('keydown',r.onKey);
    canvas.addEventListener('pointerdown',e=>{e.preventDefault();flap(s);});
    run=r;
    function loop(t){
      if(run!==r)return;
      let dt=r.last?Math.min(MAXSTEP,(t-r.last)/1000):0;r.last=t;
      step(s,dt);
      if(ctx)draw(ctx,s);
      if(s.phase==='dead'&&s.deadTime>0.7&&!r.ended){r.ended=true;onEnd(s.score);return;}
      r.raf=requestAnimationFrame(loop);
    }
    r.raf=requestAnimationFrame(loop);
  }
  return {name:'Flappy Bird',cost:1,tries:TRIES,start:start,stop:stop,sim:{speedFactor:speedFactor,newState:newState,flap:flap,step:step,W:W,H:H,GAP:GAP,GROUND:GROUND,BX:BX}};
})();
</script>

<!-- ╔════════════════════════════════════════════════════════════════
     ║  2b) ZUSATZSPIELE (Shop)  –  Snake und Stapelturm                    ║
     ║  Gleiche Schnittstelle wie GAME: name, cost, tries, start, stop.     ║
     ║  GAMES ist die Liste aller Spiele; Flappy Bird ist immer freigeschaltet. ║
     ╚════════════════════════════════════════════════════════════════╝ -->
<script>
const SNAKE=(function(){
  const N=18,C=20,W=N*C,H=N*C,TRIES=3,SCALE=1.2;
  function newState(){return {phase:'ready',dir:{x:1,y:0},q:[],snake:[{x:5,y:9},{x:4,y:9},{x:3,y:9}],apple:null,score:0,acc:0,deadTime:0};}
  function placeApple(s){
    let free=[];
    for(let x=0;x<N;x++)for(let y=0;y<N;y++){if(!s.snake.some(p=>p.x===x&&p.y===y))free.push({x:x,y:y});}
    s.apple=free.length?free[Math.floor(Math.random()*free.length)]:null;
  }
  function turn(s,dx,dy){
    if(s.phase==='dead')return;
    let last=s.q.length?s.q[s.q.length-1]:s.dir;
    if((dx===-last.x&&dy===-last.y)||(dx===last.x&&dy===last.y))return;   /* keine Umkehr, kein Doppeltes */
    if(s.q.length<2)s.q.push({x:dx,y:dy});
    if(s.phase==='ready')s.phase='run';
  }
  function interval(score){return Math.max(0.075,0.16-0.004*score);}
  function step(s,dt){
    if(s.phase==='dead'){s.deadTime+=dt;return;}
    if(s.phase!=='run')return;
    s.acc+=dt;
    while(s.phase==='run'&&s.acc>=interval(s.score)){
      s.acc-=interval(s.score);
      if(s.q.length)s.dir=s.q.shift();
      let h=s.snake[0],nx=h.x+s.dir.x,ny=h.y+s.dir.y;
      let eat=!!s.apple&&nx===s.apple.x&&ny===s.apple.y;
      let body=eat?s.snake:s.snake.slice(0,-1);   /* die Schwanzspitze wird frei, wenn nichts gefressen wird */
      if(nx<0||ny<0||nx>=N||ny>=N||body.some(p=>p.x===nx&&p.y===ny)){s.phase='dead';s.deadTime=0;return;}
      s.snake.unshift({x:nx,y:ny});
      if(eat){s.score++;placeApple(s);if(!s.apple){s.phase='dead';s.deadTime=0;}}
      else s.snake.pop();
    }
  }
  function outline(ctx,t,x,y){ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.strokeText(t,x,y);ctx.fillStyle='#fff';ctx.fillText(t,x,y);}
  function draw(ctx,s){
    for(let x=0;x<N;x++)for(let y=0;y<N;y++){ctx.fillStyle=(x+y)%2?'#a8d86a':'#b9e07a';ctx.fillRect(x*C,y*C,C,C);}
    if(s.apple){
      let a=s.apple;
      ctx.fillStyle='#e53935';ctx.beginPath();ctx.arc(a.x*C+C/2,a.y*C+C/2+1,C*0.38,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#2e7d32';ctx.fillRect(a.x*C+C/2-1,a.y*C+1,3,5);
    }
    s.snake.forEach(function(p,i){
      ctx.fillStyle=i===0?'#1b5e20':(i%2?'#2e7d32':'#388e3c');
      ctx.fillRect(p.x*C+1,p.y*C+1,C-2,C-2);
    });
    let h=s.snake[0],d=s.dir,ex=h.x*C+C/2,ey=h.y*C+C/2,px=-d.y,py=d.x;
    ctx.fillStyle='#fff';
    [-1,1].forEach(function(k){ctx.beginPath();ctx.arc(ex+d.x*3+px*k*4,ey+d.y*3+py*k*4,2.6,0,Math.PI*2);ctx.fill();});
    ctx.fillStyle='#111';
    [-1,1].forEach(function(k){ctx.beginPath();ctx.arc(ex+d.x*4+px*k*4,ey+d.y*4+py*k*4,1.3,0,Math.PI*2);ctx.fill();});
    ctx.textAlign='center';ctx.font='bold 26px Arial';outline(ctx,String(s.score),W/2,34);
    if(s.phase==='ready'){ctx.font='bold 20px Arial';outline(ctx,'Pfeiltasten oder Wischen',W/2,H/2-20);outline(ctx,'zum Starten',W/2,H/2+8);}
    if(s.phase==='dead'){ctx.font='bold 30px Arial';outline(ctx,'Aus!',W/2,H/2);}
  }
  let run=null;
  function stop(){
    if(!run)return;
    cancelAnimationFrame(run.raf);
    document.removeEventListener('keydown',run.onKey);
    run=null;
  }
  function start(root,onEnd){
    stop();root.innerHTML='';
    let K=Math.max(0.7,Math.min(SCALE,(window.innerHeight-190)/H,(window.innerWidth-60)/W));
    let canvas=document.createElement('canvas');canvas.width=Math.round(W*K);canvas.height=Math.round(H*K);
    canvas.style.touchAction='none';
    root.appendChild(canvas);
    let ctx=canvas.getContext('2d');if(ctx)ctx.setTransform(K,0,0,K,0,0);
    let s=newState();placeApple(s);
    let r={raf:0,ended:false,last:0};
    const KEYS={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1],A:[-1,0],D:[1,0],W:[0,-1],S:[0,1]};
    r.onKey=function(e){let v=KEYS[e.key];if(v){e.preventDefault();turn(s,v[0],v[1]);}};
    document.addEventListener('keydown',r.onKey);
    let sx=0,sy=0,sw=false;   /* Wischen: Richtung aus der Fingerbewegung */
    canvas.addEventListener('pointerdown',function(e){e.preventDefault();sx=e.clientX;sy=e.clientY;sw=true;});
    canvas.addEventListener('pointermove',function(e){
      if(!sw)return;
      let dx=e.clientX-sx,dy=e.clientY-sy;
      if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;
      if(Math.abs(dx)>Math.abs(dy))turn(s,dx>0?1:-1,0);else turn(s,0,dy>0?1:-1);
      sx=e.clientX;sy=e.clientY;
    });
    ['pointerup','pointercancel','pointerleave'].forEach(function(t){canvas.addEventListener(t,function(){sw=false;});});
    run=r;
    function loop(t){
      if(run!==r)return;
      let dt=r.last?Math.min(0.05,(t-r.last)/1000):0;r.last=t;
      step(s,dt);
      if(ctx)draw(ctx,s);
      if(s.phase==='dead'&&s.deadTime>0.7&&!r.ended){r.ended=true;onEnd(s.score);return;}
      r.raf=requestAnimationFrame(loop);
    }
    r.raf=requestAnimationFrame(loop);
  }
  return {id:'snake',icon:'🐍',name:'Snake',hint:'Pfeiltasten oder Wischen = lenken · Esc = beenden',cost:1,tries:TRIES,start:start,stop:stop,sim:{newState:newState,placeApple:placeApple,turn:turn,step:step,N:N}};
})();

const TOWER=(function(){
  const W=360,H=520,BH=24,GROUND=H-50,W0=190,HOVER=90,TRIES=3,SCALE=1.2;
  function landY(s){return GROUND-(s.blocks.length+1)*BH;}
  function speed(score){return Math.min(380,130+9*score);}
  function spawn(s){
    let w=s.blocks[s.blocks.length-1].w;
    s.cur={x:s.fromLeft?0:W-w,w:w,y:landY(s)-HOVER,vy:0,dir:s.fromLeft?1:-1};
    s.fromLeft=!s.fromLeft;s.mode='hover';
  }
  function newState(){
    let s={phase:'ready',mode:'hover',blocks:[{x:(W-W0)/2,w:W0}],cur:null,pieces:[],score:0,cam:0,deadTime:0,msg:'',msgT:0,fromLeft:true};
    spawn(s);return s;
  }
  function drop(s){if(s.phase!=='dead'&&s.mode==='hover'){s.mode='fall';s.phase='run';s.cur.vy=0;}}
  function land(s){
    let p=s.blocks[s.blocks.length-1],c=s.cur;
    let left=Math.max(c.x,p.x),right=Math.min(c.x+c.w,p.x+p.w),ov=right-left;
    if(ov<=0){s.phase='dead';s.deadTime=0;s.msg='Daneben!';s.msgT=9;return;}   /* der Stein verfehlt den Turm und fällt weiter */
    if(Math.abs(c.x-p.x)<=4){s.blocks.push({x:p.x,w:p.w});s.msg='Perfekt!';s.msgT=0.8;}
    else{
      s.blocks.push({x:left,w:ov});
      if(c.x<p.x)s.pieces.push({x:c.x,w:p.x-c.x,y:c.y,vy:0,i:s.blocks.length});
      else s.pieces.push({x:p.x+p.w,w:c.x+c.w-(p.x+p.w),y:c.y,vy:0,i:s.blocks.length});
    }
    s.score++;
    spawn(s);
  }
  function step(s,dt){
    let target=Math.max(0,s.blocks.length*BH-(GROUND-230));
    s.cam+=(target-s.cam)*Math.min(1,dt*4);
    s.pieces.forEach(function(q){q.vy+=1500*dt;q.y+=q.vy*dt;});
    s.pieces=s.pieces.filter(function(q){return q.y<H+s.cam+60;});
    if(s.msgT>0)s.msgT-=dt;
    if(s.phase==='dead'){s.deadTime+=dt;if(s.cur){s.cur.vy+=1800*dt;s.cur.y+=s.cur.vy*dt;}return;}
    let c=s.cur;
    if(s.mode==='hover'){
      c.x+=c.dir*speed(s.score)*dt;
      if(c.x<=0){c.x=0;c.dir=1;}else if(c.x+c.w>=W){c.x=W-c.w;c.dir=-1;}
    }else{
      c.vy+=2400*dt;c.y+=c.vy*dt;
      let ly=landY(s);
      if(c.y>=ly){c.y=ly;land(s);}
    }
  }
  function outline(ctx,t,x,y){ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.strokeText(t,x,y);ctx.fillStyle='#fff';ctx.fillText(t,x,y);}
  function color(i){return 'hsl('+((i*27+8)%360)+',55%,60%)';}
  function brick(ctx,x,y,w,i){
    ctx.fillStyle=color(i);ctx.fillRect(x,y,w,BH);
    ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1.5;ctx.strokeRect(x+0.75,y+0.75,w-1.5,BH-1.5);
    if(w>=40){
      ctx.fillStyle='#fff6bf';
      for(let wx=x+12;wx+8<=x+w-8;wx+=24)ctx.fillRect(wx,y+8,8,9);
    }
  }
  function draw(ctx,s){
    let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#8fd3f4');g.addColorStop(1,'#e8f6ff');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#7cb342';ctx.fillRect(0,GROUND+s.cam,W,H);
    ctx.fillStyle='#a1887f';ctx.fillRect(0,GROUND+s.cam+BH*0.0,W,6);
    s.blocks.forEach(function(b,i){brick(ctx,b.x,GROUND-(i+1)*BH+s.cam,b.w,i);});
    s.pieces.forEach(function(q){brick(ctx,q.x,q.y+s.cam,q.w,q.i);});
    if(s.cur)brick(ctx,s.cur.x,s.cur.y+s.cam,s.cur.w,s.blocks.length);
    ctx.textAlign='center';ctx.font='bold 30px Arial';outline(ctx,String(s.score),W/2,44);
    if(s.msgT>0&&s.msg){ctx.font='bold 24px Arial';outline(ctx,s.msg,W/2,H/2-40);}
    if(s.phase==='ready'){ctx.font='bold 18px Arial';outline(ctx,'Leertaste oder Tippen:',W/2,H-18);}
  }
  let run=null;
  function stop(){
    if(!run)return;
    cancelAnimationFrame(run.raf);
    document.removeEventListener('keydown',run.onKey);
    run=null;
  }
  function start(root,onEnd){
    stop();root.innerHTML='';
    let K=Math.max(0.7,Math.min(SCALE,(window.innerHeight-190)/H,(window.innerWidth-60)/W));
    let canvas=document.createElement('canvas');canvas.width=Math.round(W*K);canvas.height=Math.round(H*K);
    canvas.style.touchAction='none';
    root.appendChild(canvas);
    let ctx=canvas.getContext('2d');if(ctx)ctx.setTransform(K,0,0,K,0,0);
    let s=newState();
    let r={raf:0,ended:false,last:0};
    r.onKey=function(e){if((e.code==='Space'||e.key==='ArrowDown')&&!e.repeat){e.preventDefault();drop(s);}};
    document.addEventListener('keydown',r.onKey);
    canvas.addEventListener('pointerdown',function(e){e.preventDefault();drop(s);});
    run=r;
    function loop(t){
      if(run!==r)return;
      let dt=r.last?Math.min(0.05,(t-r.last)/1000):0;r.last=t;
      step(s,dt);
      if(ctx)draw(ctx,s);
      if(s.phase==='dead'&&s.deadTime>0.9&&!r.ended){r.ended=true;onEnd(s.score);return;}
      r.raf=requestAnimationFrame(loop);
    }
    r.raf=requestAnimationFrame(loop);
  }
  return {id:'tower',icon:'🏠',name:'Stapelturm',hint:'Leertaste oder Tippen = Stein fallen lassen · Esc = beenden',cost:1,tries:TRIES,start:start,stop:stop,sim:{newState:newState,drop:drop,step:step,W:W,BH:BH,GROUND:GROUND}};
})();

const GAMES={
  flappy:{id:'flappy',icon:'🐦',name:GAME.name,hint:'Leertaste (oder Klick / Tippen) = fliegen · Esc = beenden',cost:GAME.cost,tries:GAME.tries,start:function(r,e){GAME.start(r,e);},stop:function(){GAME.stop();}},
  snake:SNAKE,
  tower:TOWER
};
const GAMES_ORDER=['flappy','snake','tower'];
</script>

<!-- ╔══════════════════════════════════════════════════════════════════════╗
     ║  3) ENGINE  –  themenunabhängig, beim Themenwechsel NICHT ändern      ║
     ║  (Oberfläche, Levels/XP, Cookies, Achievements, Zeitrennen, Speichern)║
     ╚══════════════════════════════════════════════════════════════════════╝ -->
<script>
const LEVELS=TOPIC.levels;
const LAST=LEVELS.length-1;                 /* Index des höchsten Levels */
function lvlName(l){return LEVELS[l].icon+' '+LEVELS[l].name;}

/* Titel und Styles aus dem Themen-Block übernehmen */
document.title=TOPIC.title;
document.getElementById('topicTitle').textContent=TOPIC.title;
document.getElementById('topicSubtitle').textContent=TOPIC.subtitle;
document.getElementById('themeCss').textContent=TOPIC.css;

let lossActive=false,lossFrom=0,lossTo=0;   /* roter Verlust-Abschnitt im XP-Balken */
let solved=0,streak=0,xp=0,schutz=0,cookies=0,gameBest=0,current={},achs=[];
/* Smartphone: eigene Zahlentasten (statt der Bildschirmtastatur) und einklappbare Achievements */
(function(){
  const kp=document.getElementById('keypad');
  const mq=window.matchMedia('(max-width:700px)');
  function sync(){if(mq.matches)answer.setAttribute('inputmode','none');else answer.removeAttribute('inputmode');}
  sync();if(mq.addEventListener)mq.addEventListener('change',sync);else mq.addListener(sync);
  kp.addEventListener('mousedown',function(e){e.preventDefault();});   /* Fokus bleibt im Antwortfeld */
  kp.addEventListener('click',function(e){
    const b=e.target.closest('button[data-k]');if(!b)return;
    const k=b.getAttribute('data-k');
    if(k==='ok'){checkAnswer();return;}
    answer.focus();
    let s=answer.selectionStart,t=answer.selectionEnd,v=answer.value;
    if(s==null){s=t=v.length;}
    if(k==='del'){
      if(s!==t){v=v.slice(0,s)+v.slice(t);}
      else if(s>0){v=v.slice(0,s-1)+v.slice(s);s--;}
      answer.value=v;answer.setSelectionRange(s,s);
    }else{
      answer.value=v.slice(0,s)+k+v.slice(t);answer.setSelectionRange(s+k.length,s+k.length);
    }
  });
  const ach=document.querySelector('.ach');
  ach.querySelector('h3').addEventListener('click',function(){ach.classList.toggle('open');});
})();
/* ---------- Gemeinsamer Cookie-Geldbeutel ----------
   Alle Trainer auf derselben Internetadresse teilen sich diese Cookies (localStorage-Eintrag test_mathe_wallet).
   Verdienen und Ausgeben (Spiel) wirken direkt auf den gemeinsamen Stand. XP, Level und Rekorde bleiben pro Trainer. */
const WALLET_KEY='test_mathe_wallet';
let memWallet=0,walletMigrated=false;   /* memWallet: Reserve, falls der Browser-Speicher blockiert ist */
function walletGet(){try{let w=JSON.parse(localStorage.getItem(WALLET_KEY));if(w&&typeof w.balance==='number'&&isFinite(w.balance)){memWallet=Math.max(0,Math.floor(w.balance));return memWallet;}}catch(e){}return memWallet;}
function walletRead(){try{let w=JSON.parse(localStorage.getItem(WALLET_KEY));if(w&&typeof w==='object')return w;}catch(e){}return null;}
function walletSet(n){memWallet=Math.max(0,Math.floor(n));try{let w=walletRead()||{};w.balance=memWallet;localStorage.setItem(WALLET_KEY,JSON.stringify(w));}catch(e){}return memWallet;}   /* behält z. B. die gekauften Spiele */
function walletGames(){return ['snake','tower'];}   /* Testversion: alle Spiele freigeschaltet */   /* im Shop gekaufte Spiele */
function walletRecords(){let w=walletRead();return (w&&w.records&&typeof w.records==='object')?w.records:{};}
/* Spiel-Rekorde gelten für alle Trainer: es zählt der höhere Wert (lokal oder im gemeinsamen Speicher) */
function mergeBests(){
  let wr=walletRecords(),changed=false;
  GAMES_ORDER.forEach(function(id){
    let loc=id==='flappy'?gameBest:(gameBests[id]||0),rem=Math.max(0,parseInt(wr[id])||0),v=Math.max(loc,rem);
    if(id==='flappy')gameBest=v;else if(v>0)gameBests[id]=v;
    if(v>rem){wr[id]=v;changed=true;}
  });
  if(changed){try{let w=walletRead()||{};w.records=wr;if(typeof w.balance!=='number')w.balance=memWallet;localStorage.setItem(WALLET_KEY,JSON.stringify(w));}catch(e){}}
}
function walletAdd(d){return walletSet(walletGet()+d);}
function walletRefresh(){let c=walletGet();if(c!==cookies){cookies=c;cookieShow.textContent=cookies;updateGameBtn();}renderRecords();}
window.addEventListener('storage',function(e){if(e.key===WALLET_KEY)walletRefresh();});
document.addEventListener('visibilitychange',function(){if(!document.hidden)walletRefresh();});
window.addEventListener('focus',walletRefresh);
/* Cookies aus einem Lernstand übernehmen: alte Stände (ohne cw) werden einmalig dazugezählt; eine Datei stellt höchstens den höheren Stand wieder her */
function adoptCookies(d,fromFile){
  let fc=Math.max(0,parseInt(d.cookies)||0);
  if(fromFile){if(fc>walletGet())walletSet(fc);}
  else if(!d.cw){walletAdd(fc);walletMigrated=true;}
  return walletGet();
}

/* Cookies: 1 pro 50 gelöste Aufgaben insgesamt, 1 pro 25 richtige am Stück (wiederholbar, unabhängig von den Achievements) */
const COOKIE_TOTAL=50,COOKIE_STREAK=25;
/* Zeitrennen: möglichst viele Aufgaben in RACE_SECONDS; Aufgaben immer aus dem Level TOPIC.raceLevel; Rekord pro Level */
const RACE_LEVEL=TOPIC.raceLevel;
const RACE_SECONDS=60;
let race={active:false,phase:'',end:0,count:0,level:0,timer:null};
let records=LEVELS.map(()=>0);
const XP_RIGHT=10,XP_LOSS=5; /* richtig: +10 XP, Fehlversuch 1 und 2: je -5 XP (Hälfte) */
/* XP-Multiplikator bei Serie: je 3 richtige am Stück +0.25, höchstens x2.5 (3 am Stück: x1.25, 6: x1.5 ... 15: x2.5).
   Dadurch bleiben sehr gute SuS nicht zu lange bei den einfachen Aufgaben hängen. */
const STREAK_XP_STEP=3,STREAK_XP_ADD=0.25,STREAK_XP_MAX=2.5;
function xpMultiplier(st){return Math.min(STREAK_XP_MAX,1+Math.floor(st/STREAK_XP_STEP)*STREAK_XP_ADD);}
const LEVEL_XP=150,MAX_XP=LEVEL_XP*(LAST+1); /* 150 XP pro Level = netto 15 richtige Antworten; das höchste Level hat auch einen Balken, bei MAX_XP ist er voll */
/* Eigene Referenz auf das Namensfeld (window.name ist in JavaScript bereits belegt) */
const nameInput=document.getElementById('name');

function getLevel(){return Math.min(LAST,Math.floor(xp/LEVEL_XP));}

function update(){if(window.lvlJump)lvlJump.value=getLevel();if(lvlSelFor!==getLevel())buildLvlSel();autoSave();updateGameBtn();let l=getLevel();level.innerHTML='<b>Level '+(l+1)+' - '+lvlName(l)+'</b>'+(practiceLevel!==null?' &nbsp;·&nbsp; 📘 Üben in '+lvlName(practiceLevel)+' (ohne XP)':'');correct.textContent=solved;cookieShow.textContent=cookies;let start=l*LEVEL_XP;fill.style.width=((xp-start)/LEVEL_XP*100)+'%';
  /* roter Abschnitt: so viel XP wurde bei Fehlern verloren (bleibt bis zur nächsten richtigen Antwort) */
  if(lossActive){
    let a=Math.max(0,Math.min(1,(lossFrom-start)/LEVEL_XP)),b=Math.max(0,Math.min(1,(lossTo-start)/LEVEL_XP));
    if(b>a){loss.style.left=(a*100)+'%';loss.style.width=((b-a)*100)+'%';loss.style.display='block';}else loss.style.display='none';
  }else loss.style.display='none';
}

/* Neue Aufgabe vom Themen-Block holen (forcedLevel: z. B. im Zeitrennen) */
/* Optionale Auswahlliste des Themas (z. B. Kategorie): Wahl wird gespeichert und an makeTask übergeben */
function getOpt(){return TOPIC.options?topicOpt.value:undefined;}
/* Eigene XP/Levels pro Auswahl (z. B. pro Kategorie): xp gehört immer zur aktuell gewählten Auswahl, die anderen liegen in xpMap */
let xpMap={},curOpt=(TOPIC.options?TOPIC.options.default:'_');
/* Übungslevel: tieferes Level freiwillig wählen; dort gibt es keine XP (weder Gewinn noch Verlust) */
let practiceLevel=null,lvlSelFor=-1;
function playLevel(){return practiceLevel!==null?practiceLevel:getLevel();}
function buildLvlSel(){
  let cur=getLevel();
  if(practiceLevel!==null&&practiceLevel>=cur)practiceLevel=null;
  lvlSel.innerHTML='';
  for(let i=0;i<=cur;i++){
    let o=document.createElement('option');o.value=i;
    o.textContent='Level '+(i+1)+' – '+lvlName(i)+(i===cur?' (aktuell)':' (üben, ohne XP)');
    lvlSel.appendChild(o);
  }
  lvlSel.value=(practiceLevel!==null)?practiceLevel:cur;
  lvlSel.disabled=(cur===0);
  lvlSel.title=cur===0?'Noch kein tieferes Level vorhanden':'Level zum Üben wählen (tiefere Level geben keine XP)';
  lvlSelFor=cur;
}
function lvlSelChange(){
  let v=parseInt(lvlSel.value);
  practiceLevel=(v===getLevel())?null:v;
  lvlSel.blur();
  if(race.active)return;
  update();newTask();answer.focus();
}
if(TOPIC.options){
  TOPIC.options.choices.forEach(c=>{let o=document.createElement('option');o.value=c.v;o.textContent=c.label;topicOpt.appendChild(o);});
  topicOpt.value=TOPIC.options.default;
  optRow.style.display='inline';
  topicOpt.addEventListener('change',()=>{
    topicOpt.blur();
    if(race.active){topicOpt.value=curOpt;return;}
    xpMap[curOpt]=xp;curOpt=topicOpt.value;xp=xpMap[curOpt]||0;
    schutz=0;lossActive=false;practiceLevel=null;
    buildLvlSel();autoSave();update();newTask();answer.focus();
  });
}
function newTask(forcedLevel){
  update();
  let l=(forcedLevel===undefined)?playLevel():forcedLevel;
  current=TOPIC.makeTask(l,(forcedLevel!==undefined&&TOPIC.raceOption)?TOPIC.raceOption:getOpt());   /* Zeitrennen: festgelegte Auswahl des Themas */
  current.wrong=0;
  document.getElementById('task').textContent=current.text;
  answer.value='';
}

/* Pop-ups kommen nacheinander (Warteschlange); jedes Enter / jeder Klick auf Weiter zeigt das nächste */
let popupQueue=[];
function nextPopup(){
  let p=popupQueue.shift();
  if(!p){popup.style.display='none';return false;}
  popupTitle.textContent=p[0];popupText.innerHTML=p[1];popup.style.display='flex';
  return true;
}
function showPopup(t,txt){popupQueue.push([t,txt]);if(popup.style.display!=='flex')nextPopup();}

/* Pop-up schliessen und Cursor zurück ins Antwortfeld */
function closePopup(){if(nextPopup())return;answer.focus();}

/* Solange ein Pop-up offen ist: Enter schliesst es und löst NICHT die Aufgabe aus.
   Capture-Phase, damit die Taste das Antwortfeld gar nicht mehr erreicht.
   Gedrückt gehaltenes Enter (Wiederholung) wird ignoriert. */
document.addEventListener('keydown',e=>{
  if(popup.style.display==='flex'&&e.key==='Enter'){
    e.preventDefault();
    e.stopPropagation();
    if(!e.repeat)closePopup();
  }
},true);

/* Achievements in zwei Gruppen:
   1) Medaillen des Themas (TOPIC.medals) bei MEDAL_AT gelösten Aufgaben insgesamt
   2) Serien: richtige Antworten am Stück (STREAK_ACHS)
   Angezeigt werden sie immer gruppiert und in fester Reihenfolge, unabhängig davon, wann sie freigeschaltet wurden. */
const MEDAL_AT=[10,25,50,100];
const STREAK_ACHS=[[5,'🔥 5 Aufgaben fehlerfrei'],[10,'🚀 10 Aufgaben fehlerfrei'],[25,'💎 25 Aufgaben fehlerfrei'],[50,'🌋 50 Aufgaben fehlerfrei']];
const MEDAL_NAMES=TOPIC.medals;
const STREAK_NAMES=STREAK_ACHS.map(x=>x[1]);
const ALL_ACHS=MEDAL_NAMES.concat(STREAK_NAMES);
/* Platzhalter-Liste: reserviert unter dem Titel immer den Platz für alle Achievements (neue hier ergänzen) */
achSizer.innerHTML=MEDAL_NAMES.map(x=>'<li>'+x+'</li>').join('')+STREAK_NAMES.map((x,i)=>'<li'+(i===0?' class="gap"':'')+'>'+x+'</li>').join('');
function renderAchs(){
  let m=MEDAL_NAMES.filter(x=>achs.includes(x));
  let st=STREAK_NAMES.filter(x=>achs.includes(x));
  achievements.innerHTML=m.map(x=>'<li>'+x+'</li>').join('')+st.map((x,i)=>'<li'+(i===0&&m.length?' class="gap"':'')+'>'+x+'</li>').join('');
}
function addAch(a){if(!achs.includes(a)){achs.push(a);renderAchs();showPopup('🏆 Achievement freigeschaltet!',a);}}

/* XP abziehen (nie unter 0). Dabei kann man ein Level absteigen.
   Auf dem Levelanfang (0 XP im Level) wird der erste Fehler abgefangen (Schutz):
   erst bei der 2. falschen Antwort in Folge steigt man ab
   und landet im tieferen Level bei ca. 75 %. */
const SCHUTZ_MAX=2;
const ABSTIEG_XP=Math.floor(LEVEL_XP*0.75/XP_LOSS)*XP_LOSS; /* 110 von 150 = ca. 75 % */
function loseXP(){
  if(xp===0)return;
  if(xp===getLevel()*LEVEL_XP){   /* genau am Levelanfang (im höchsten Level ist ein voller Balken kein Levelanfang) */
    schutz++;
    if(schutz<SCHUTZ_MAX)return;
    schutz=0;
    xp=xp-LEVEL_XP+ABSTIEG_XP;   /* Abstieg: im tieferen Level bei ca. 75 % landen */
    return;
  }
  xp-=XP_LOSS;
}

/* Einmalige Cookies (insgesamt, nicht pro Kategorie): beim ersten Erreichen von Level 3 und beim ersten vollen Balken im höchsten Level */
let cookieFlags={lv:false,max:false};
const LEVEL_COOKIE_AT=2;   /* Index von Level 3 */
function levelCookies(){
  let f=cookieFlags;
  if(!f.lv&&getLevel()>=LEVEL_COOKIE_AT){f.lv=true;giveCookie('Du hast zum ersten Mal <b>Level '+(LEVEL_COOKIE_AT+1)+'</b> erreicht.');}
  if(!f.max&&xp>=MAX_XP){f.max=true;giveCookie('Du hast das <b>höchste Level</b> voll geschafft!');}
}
function giveCookie(why){
  cookies=walletAdd(1);
  cookieShow.textContent=cookies;
  showPopup('🍪 Cookie verdient!',why+'<br><br>Du hast jetzt <b>'+cookies+'</b> Cookie'+(cookies===1?'':'s')+'.');
}

function checkAnswer(){
  if(race.active){if(race.phase==='run')raceAnswer();return;}
  let before=getLevel();
  if(TOPIC.check(answer.value,current)){
    /* Ab der Hilfestellung (2. Fehlversuch) gibt es keine XP mehr */
    let gain=(practiceLevel!==null||current.wrong>=2)?0:Math.round(XP_RIGHT*xpMultiplier(streak));   /* streak = Serie VOR dieser Aufgabe */
    let practice=(practiceLevel!==null);   /* Übungslevel: XP, Zähler (gelöst/Serie), Achievements und Cookies pausieren */
    xp=Math.min(MAX_XP,xp+gain);schutz=0;lossActive=false;
    if(!practice){solved++;streak++;}
    feedback.innerHTML='✅ Richtig!';
    if(!practice){
      MEDAL_AT.forEach((n,i)=>{if(solved===n&&MEDAL_NAMES[i])addAch(MEDAL_NAMES[i]);});
      STREAK_ACHS.forEach(x=>{if(streak===x[0])addAch(x[1]);});
      if(solved%COOKIE_TOTAL===0)giveCookie('Du hast insgesamt <b>'+solved+'</b> Aufgaben gelöst.');
      if(streak%COOKIE_STREAK===0)giveCookie('Du hast <b>'+streak+'</b> Aufgaben am Stück richtig gelöst.');
    }
    let after=getLevel();
    if(!practice)levelCookies();
    newTask();
    if(after>before){showPopup('🎉 Levelaufstieg!','Du hast das Level <b>'+lvlName(after)+'</b> erreicht.<br><br>🙌 Hol dir ein High Five oder eine Ghetto-Faust von der Lehrperson!');}
  }else{
    if(practiceLevel===null)streak=0;   /* im Übungslevel pausiert auch die Serie */
    current.wrong++;
    /* 1. und 2. Fehlversuch: je die Hälfte der XP einer richtigen Antwort weg; danach nichts mehr */
    if(current.wrong<=2&&practiceLevel===null){
      let xpBefore=xp;loseXP();
      if(xp<xpBefore){if(!lossActive){lossTo=xpBefore;lossActive=true;}lossFrom=xp;}
    }
    let xpText='';
    if(getLevel()<before)xpText='<br>⬇️ Du bist ein Level abgestiegen: <b>'+lvlName(getLevel())+'</b>';
    update();
    if(current.wrong<2){
      feedback.innerHTML='❌ Noch nicht korrekt.'+xpText+'<br><br>Überdenke deine Lösung und versuche es nochmals.';
    }else{
      feedback.innerHTML='❌ Noch nicht korrekt.'+xpText+'<br><br>'+TOPIC.help(current)+'<br><br>Überdenke deine Lösung und versuche es nochmals.';
    }
  }
}

/* ---------- Zeitrennen ---------- */
/* Bewertung des Rekords (Anzahl gelöster Aufgaben in der Rennzeit); pro Thema mit TOPIC.raceRating anpassbar */
const RACE_RATING=TOPIC.raceRating||[
  {min:10,icon:'🤖',name:'Maschine'},
  {min:6,icon:'🏃',name:'Sprinter'},
  {min:3,icon:'🚶',name:'Spaziergänger'},
  {min:1,icon:'🐌',name:'Schnecke'}
];
function rating(n){for(const r of RACE_RATING){if(n>=r.min)return r;}return null;}

/* Zeit-Rekord anzeigen: Rang-Emoji, Name und Anzahl, z. B. "🐌 Schnecke: 2 Aufgaben".
   Das Zeitrennen läuft immer im Level RACE_LEVEL, darum gibt es nur diesen einen Rekord. */
function renderRecords(){
  mergeBests();
  let n=records[RACE_LEVEL]||0;
  let rows=[];
  if(n>0){
    let r=rating(n);
    rows.push('<li>'+(r?r.icon+' '+r.name+': ':'')+'<b>'+n+'</b> Aufgabe'+(n===1?'':'n')+'</li>');
  }
  if(gameBest>0)rows.push('<li>🐦 Flappy Bird: <b>'+gameBest+'</b> Punkt'+(gameBest===1?'':'e')+'</li>');
  GAMES_ORDER.forEach(function(id){let b=gameBests[id]||0;if(id!=='flappy'&&b>0)rows.push('<li>'+GAMES[id].icon+' '+GAMES[id].name+': <b>'+b+'</b> Punkt'+(b===1?'':'e')+'</li>');});
  recordList.innerHTML=rows.join('');
  recordBox.style.display=rows.length?'block':'none';
  autoSave();
}

function startRace(){
  if(race.active){endRaceUI();return;}   /* Button ist während des Rennens "Abbrechen" */
  race={active:true,phase:'count',end:0,count:0,level:RACE_LEVEL,timer:null};
  raceCount.textContent=0;
  raceTime.textContent=RACE_SECONDS;
  raceBar.style.display='block';
  raceBtn.textContent='✖ Abbrechen';
  updateGameBtn();
  feedback.innerHTML='';
  answer.value='';
  answer.disabled=true;                  /* während der Vorbereitung nicht tippen */
  let n=3;
  const showCount=()=>{document.getElementById('task').textContent='Los geht’s in '+n+' …';};
  showCount();
  race.timer=setInterval(()=>{
    n--;
    if(n>0){showCount();return;}
    clearInterval(race.timer);
    beginRace();
  },1000);
}

/* Nach den 3 Sekunden Vorbereitung: erste Aufgabe zeigen, dann läuft die Zeit */
function beginRace(){
  race.phase='run';
  race.end=Date.now()+RACE_SECONDS*1000;
  answer.disabled=false;
  newTask(RACE_LEVEL);
  answer.focus();
  raceTick();
  race.timer=setInterval(raceTick,200);
}

function raceTick(){
  let left=Math.max(0,Math.ceil((race.end-Date.now())/1000));
  raceTime.textContent=left;
  raceBar.classList.toggle('low',left<=10);
  if(Date.now()>=race.end)finishRace();
}

/* Im Zeitrennen: kein XP, keine Hilfe, keine Achievements. Bei Fehler bleibt die Aufgabe stehen. */
function raceAnswer(){
  if(TOPIC.check(answer.value,current)){
    race.count++;
    raceCount.textContent=race.count;
    feedback.innerHTML='✅';
    newTask(RACE_LEVEL);
  }else{
    feedback.innerHTML='❌ Nochmals versuchen';
    answer.value='';
  }
  answer.focus();
}

function endRaceUI(){
  clearInterval(race.timer);
  race.active=false;race.phase='';
  answer.disabled=false;
  raceBar.style.display='none';
  raceBar.classList.remove('low');
  raceBtn.textContent='⏱️ Zeitrennen';
  feedback.innerHTML='';
  newTask();
}

function finishRace(){
  let n=race.count,l=race.level;
  let isRecord=n>(records[l]||0);
  if(isRecord)records[l]=n;
  endRaceUI();
  renderRecords();
  let txt='Du hast <b>'+n+'</b> Aufgabe'+(n===1?'':'n')+' in '+RACE_SECONDS+' Sekunden gelöst.<br><br>';
  if(isRecord)txt+='🏆 <b>Neuer Rekord!</b>';
  else txt+='Dein Rekord: <b>'+records[l]+'</b>';
  showPopup(isRecord?'🏆 Neuer Zeit-Rekord!':'⏱️ Zeit abgelaufen!',txt);
}

answer.addEventListener('keydown',e=>{if(e.key==='Enter')checkAnswer();});

/* ---------- Spiel (Belohnung für Cookies) ---------- */
let gameOpen=false,triesLeft=0,curGame=GAMES.flappy,gameBests={};
function ownedGames(){let own=walletGames();return GAMES_ORDER.filter(function(id){return id==='flappy'||own.indexOf(id)>=0;}).map(function(id){return GAMES[id];});}   /* 1 Cookie = GAME.tries Versuche; übrige Versuche bleiben bis zum Neuladen erhalten */
function triesText(){return triesLeft>0?'noch '+triesLeft+' Versuch'+(triesLeft===1?'':'e'):GAME.cost+' 🍪 = '+GAME.tries+' Versuche';}
function updateGameBtn(){
  gameBtn.textContent='🎮 Spielen ('+(triesLeft>0?'noch '+triesLeft+' Versuch'+(triesLeft===1?'':'e'):GAME.cost+' 🍪')+')';
  let ok=(triesLeft>0||cookies>=GAME.cost)&&!race.active;
  gameBtn.disabled=!ok;
  gameBtn.title=ok?'Spiel starten':(race.active?'Nicht während des Zeitrennens':'Du brauchst '+GAME.cost+' Cookie'+(GAME.cost===1?'':'s'));
}
function beginRound(){   /* zieht bei Bedarf 1 Cookie ab (= neue Versuche) und startet einen Versuch */
  if(triesLeft<=0){
    cookies=walletGet();
    if(cookies<GAME.cost)return false;
    cookies=walletAdd(-GAME.cost);triesLeft=GAME.tries;
  }
  triesLeft--;
  gameTitle.textContent=curGame.name+' – Versuch '+(GAME.tries-triesLeft)+' von '+GAME.tries;
  gameHint.textContent=curGame.hint;
  gameResult.innerHTML='';gameAgain.style.display='none';gameSwitch.style.display='none';
  update();
  curGame.start(gameRoot,onGameEnd);
  return true;
}
function openGame(){
  if(gameOpen||race.active)return;
  cookies=walletGet();
  if(triesLeft<=0&&cookies<GAME.cost)return;
  gameOpen=true;
  answer.blur();
  gameOverlay.style.display='flex';
  if(ownedGames().length>1)showGamePicker();else{curGame=GAMES.flappy;beginRound();}
}
function onGameEnd(score){
  let id=curGame.id,best=id==='flappy'?gameBest:(gameBests[id]||0);
  let rec=score>best;
  if(rec){best=score;if(id==='flappy')gameBest=score;else gameBests[id]=score;}
  renderRecords();   /* zeigt den Rekord an und speichert automatisch */
  gameResult.innerHTML='Punkte: <b>'+score+'</b>'+(rec?' 🏆 Neuer Rekord!':'')+' &nbsp;·&nbsp; Rekord: <b>'+best+'</b>';
  gameAgain.textContent='🔄 Nochmal ('+triesText()+')';
  gameAgain.disabled=triesLeft<=0&&cookies<GAME.cost;
  gameAgain.style.display='inline-block';
  gameSwitch.style.display=ownedGames().length>1?'inline-block':'none';
}
/* Spielauswahl (nur wenn im Shop weitere Spiele gekauft wurden) */
function showGamePicker(){
  curGame.stop();
  gameTitle.textContent='Spiel wählen';gameHint.textContent='';
  gameResult.innerHTML='';gameAgain.style.display='none';gameSwitch.style.display='none';
  gameRoot.innerHTML='<div class="gpick">'+ownedGames().map(function(g){
    return '<button class="btn gpbtn" onclick="pickGame(\''+g.id+'\')"><span class="gpi">'+g.icon+'</span><span><b>'+g.name+'</b><small>'+g.hint.split(' · ')[0]+'</small></span></button>';
  }).join('')+'</div><div class="gshop"><a href="../#shop">🛒 Weitere Spiele im Shop</a></div>';
}
function pickGame(id){
  if(!GAMES[id])return;
  let prev=curGame;curGame=GAMES[id];
  if(!beginRound()){curGame=prev;gameResult.textContent='Du brauchst 1 🍪 für neue Versuche.';}
}
function gameAgainClick(btn){
  if(btn)btn.blur();
  if(!gameOpen)return;
  beginRound();
}
function closeGame(btn){
  if(btn)btn.blur();
  curGame.stop();
  gameOpen=false;
  gameOverlay.style.display='none';
  gameRoot.innerHTML='';
  update();
  answer.focus();
}
/* Solange das Spiel offen ist: Leertaste scrollt/aktiviert nichts; Esc beendet */
['keydown','keyup'].forEach(t=>document.addEventListener(t,e=>{
  if(!gameOpen)return;
  if(e.code==='Space')e.preventDefault();
  if(t==='keydown'&&e.key==='Escape')closeGame();
},true));

/* ---------- Speichern / Laden ---------- */
function saveProgress(){
  cookies=walletGet();
  let data={name:nameInput.value,solved,xp,xps:(xpMap[curOpt]=xp,xpMap),cf:cookieFlags,cw:1,gb:gameBests,streak,cookies,gameBest,achs,records,opt:getOpt()};
  let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  let clean=nameInput.value.trim().replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,'_');
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=clean?'lernstand_'+clean+'.json':'lernstand.json';
  a.click();
}

/* Lernstand aus einem Objekt übernehmen (aus Datei oder aus dem Browser-Speicher) */
function applyData(d,fromFile){
  nameInput.value=d.name||'';
  solved=d.solved||0;xp=Math.max(0,Math.min(MAX_XP,(typeof d.xp==="number")?d.xp:solved*10));streak=d.streak||0;schutz=0;cookies=adoptCookies(d,fromFile);gameBest=Math.max(0,parseInt(d.gameBest)||0);gameBests={};if(d.gb&&typeof d.gb==='object')for(const k in d.gb){if(GAMES[k])gameBests[k]=Math.max(0,parseInt(d.gb[k])||0);}popupQueue=[];lossActive=false;achs=d.achs||[];
  if(TOPIC.options&&d.opt&&[...topicOpt.options].some(o=>o.value===d.opt))topicOpt.value=d.opt;
  /* XP pro Auswahl: neue Dateien haben xps; ältere Dateien nur ein einzelnes xp (gilt dann für die gewählte Auswahl) */
  curOpt=TOPIC.options?topicOpt.value:'_';practiceLevel=null;
  /* cf: neu {lv,max}; ältere Dateien hatten es pro Kategorie ({laenge:{lv,max},…}) -> zusammenfassen */
  cookieFlags={lv:false,max:false};
  if(d.cf&&typeof d.cf==='object'){
    if('lv' in d.cf||'max' in d.cf){cookieFlags.lv=!!d.cf.lv;cookieFlags.max=!!d.cf.max;}
    else for(const k in d.cf){if(d.cf[k]&&d.cf[k].lv)cookieFlags.lv=true;if(d.cf[k]&&d.cf[k].max)cookieFlags.max=true;}
  }
  if(d.xps&&typeof d.xps==='object'){
    xpMap={};for(const k in d.xps)xpMap[k]=Math.max(0,Math.min(MAX_XP,parseInt(d.xps[k])||0));
    xp=xpMap[curOpt]||0;
  }else{xpMap={};xpMap[curOpt]=xp;}
  records=LEVELS.map((_,i)=>Math.max(0,parseInt(d.records&&d.records[i])||0));
}

loadFile.addEventListener('change',e=>{
  let r=new FileReader();
  r.onload=()=>{
    let d=JSON.parse(r.result);
    applyData(d,true);
    if(race.active)endRaceUI();
    renderRecords();
    renderAchs();
    newTask();
    feedback.innerHTML='📂 Lernstand geladen.';
  };
  r.readAsText(e.target.files[0]);
});

/* ---------- Automatisches Speichern im Browser (localStorage) ----------
   Der Schlüssel enthält die Themen-Kennung, damit mehrere Trainer sich nicht überschreiben.
   Speichern/Laden per Datei bleibt als Backup und für andere Geräte. */
const AUTO_KEY='test_trainer_'+TOPIC.id;   /* TESTVERSION: eigener Speicher, überschreibt keinen echten Lernstand */
function autoSave(){
  cookies=walletGet();
  try{
    localStorage.setItem(AUTO_KEY,JSON.stringify({name:nameInput.value,solved,xp,xps:(xpMap[curOpt]=xp,xpMap),cf:cookieFlags,cw:1,gb:gameBests,streak,cookies,gameBest,achs,records,opt:getOpt()}));
  }catch(e){}   /* z. B. InPrivate-Fenster oder blockierter Speicher: still ignorieren */
}
function autoLoad(){
  cookies=walletGet();
  try{
    let t=localStorage.getItem(AUTO_KEY);
    if(t){applyData(JSON.parse(t),false);if(walletMigrated){walletMigrated=false;autoSave();}return true;}
  }catch(e){}
  return false;
}
nameInput.addEventListener('input',autoSave);

LEVELS.forEach((l,i)=>{let o=document.createElement('option');o.value=i;o.textContent='🧪 XP-Sprung: Level '+(i+1)+' – '+l.name;lvlJump.appendChild(o);});
function jumpLevel(sel){xp=sel.value*LEVEL_XP;schutz=0;streak=0;lossActive=false;practiceLevel=null;sel.blur();update();newTask();answer.focus();}
autoLoad();
/* TESTVERSION: bei jedem Start mindestens 50 Cookies und alle Achievements; XP-Sprung gilt für die gewählte Kategorie */
cookies=walletSet(Math.max(cookies,50));solved=Math.max(solved,1000);
achs=[...new Set([...achs,...MEDAL_NAMES,...STREAK_NAMES])];
update();
renderRecords();
renderAchs();
newTask();
</script></body></html>
