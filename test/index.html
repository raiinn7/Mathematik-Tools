<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathe Tools Test</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#f4f6fb; --fg:#1d2433; --muted:#6b7488; --card:#fff; --line:#dde2ee; --accent:#3b6df0; --off:#eef0f6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151d; --fg:#e8ebf3; --muted:#98a1b5; --card:#1b2030; --line:#2b3248; --accent:#6d93ff; --off:#171b27; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:900px; margin:0 auto; padding:32px 16px 48px; }
  h1 { margin:0 0 4px; font-size:2rem; }
  p.sub { margin:0 0 24px; color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
  .card { display:block; padding:14px 16px; background:var(--card); border:1px solid var(--line); border-radius:12px; text-decoration:none; color:inherit; }
  a.card:hover { border-color:var(--accent); box-shadow:0 2px 10px rgba(59,109,240,.18); }
  .lu { font-size:.8rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--accent); }
  .name { margin:2px 0; font-size:1.05rem; font-weight:600; }
  .tool { font-size:.9rem; color:var(--muted); }
  .off { background:var(--off); opacity:.65; }
  .off .lu { color:var(--muted); }
  header { display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:12px; }
  .wallet { padding:8px 14px; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:999px; font:inherit; font-weight:700; white-space:nowrap; cursor:pointer; }
  .wallet:hover { border-color:var(--accent); }
  .testbar { margin:0 0 20px; padding:10px 14px; background:#fff3cd; color:#5c4400; border:1px solid #e0b100; border-radius:10px; font-size:.9rem; }
  .overlay { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(10,14,24,.55); }
  .overlay[hidden] { display:none; }
  .shop { width:100%; max-width:520px; max-height:100%; overflow:auto; padding:20px; background:var(--card); border:1px solid var(--line); border-radius:16px; }
  .shop h2 { margin:0; font-size:1.4rem; }
  .shop-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:4px; }
  .shop-bal { font-weight:700; }
  .shop-note { margin:0 0 14px; color:var(--muted); font-size:.9rem; }
  .item { display:flex; align-items:center; gap:14px; padding:12px; margin-bottom:10px; background:var(--bg); border:1px solid var(--line); border-radius:12px; }
  .item .ic { font-size:2rem; }
  .item .txt { flex:1; min-width:0; }
  .item .nm { font-weight:700; }
  .item .ds { font-size:.85rem; color:var(--muted); }
  .item button { padding:8px 12px; border-radius:10px; border:1px solid var(--accent); background:var(--accent); color:#fff; font:inherit; font-weight:700; cursor:pointer; white-space:nowrap; }
  .item button:disabled { background:transparent; color:var(--muted); border-color:var(--line); cursor:default; }
  .item button.sure { background:#2e9e5b; border-color:#2e9e5b; }
  .item .own { color:#2e9e5b; font-weight:700; white-space:nowrap; }
  .item.soon { opacity:.6; }
  .shop .close { padding:6px 12px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--fg); font:inherit; cursor:pointer; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Mathe Tools</h1>
      <p class="sub">Übungsaufgaben für alle Lernumgebungen im Mathbuch</p>
    </div>
    <button class="wallet" id="walletBtn" type="button" title="Shop öffnen" aria-label="Shop öffnen">🍪 <span id="cookies">0</span></button>
  </header>
  <div class="testbar">🧪 Testversion: alle Spiele sind freigeschaltet und du hast mindestens 50 🍪. Spielstände sind getrennt von der Klassenversion.</div>
  <div class="grid" id="grid"></div>
</main>
<div class="overlay" id="shopOv" hidden>
  <div class="shop" role="dialog" aria-modal="true" aria-labelledby="shopTitle">
    <div class="shop-head"><h2 id="shopTitle">🛒 Shop</h2><button class="close" id="shopClose" type="button">Schliessen</button></div>
    <p class="shop-bal">Du hast <span id="shopBal">0</span> 🍪</p>
    <p class="shop-note">Spiele spielst du in jedem Trainer mit dem Button «🎮 Spielen».</p>
    <div id="shopList"></div>
  </div>
</div>
<script>
// Neuen Trainer freischalten: bei der passenden Lernumgebung  tool: 'Name'  eintragen.
var LU = [
  { k:'A', n:'Funktionen',                  d:'lu-a-funktionen' },
  { k:'B', n:'Grössen',                     d:'lu-b-groessen',   tool:'Masseinheiten Trainer' },
  { k:'C', n:'Brüche',                      d:'lu-c-brueche',    tool:'Brüche Trainer' },
  { k:'D', n:'Zahlen',                      d:'lu-d-zahlen',     tool:'Zahlen runden Trainer' },
  { k:'E', n:'Dezimalzahlen',               d:'lu-e-dezimalzahlen', tool:'Komma Trainer' },
  { k:'F', n:'Konstruktionen',              d:'lu-f-konstruktionen' },
  { k:'G', n:'Koordinaten',                 d:'lu-g-koordinaten' },
  { k:'H', n:'Terme',                       d:'lu-h-terme' },
  { k:'J', n:'Terme umformen',              d:'lu-j-terme-umformen' },
  { k:'K', n:'Diagramme',                   d:'lu-k-diagramme' },
  { k:'L', n:'Zufall',                      d:'lu-l-zufall' },
  { k:'M', n:'Zweidimensional',             d:'lu-m-zweidimensional' },
  { k:'N', n:'Dreidimensional',             d:'lu-n-dreidimensional' },
  { k:'O', n:'Strecken, Flächen, Volumen',  d:'lu-o-strecken-flaechen-volumen' },
  { k:'P', n:'Einführung Gleichung',        d:'lu-p-einfuehrung-gleichung' },
  { k:'Q', n:'Gleichungen bearbeiten',      d:'lu-q-gleichungen-bearbeiten' },
  { k:'R', n:'Prozente',                    d:'lu-r-prozente' }
];
/* Gemeinsamer Cookie-Stand: wird von allen Trainern unter derselben Adresse geschrieben */
var WALLET_KEY = 'test_mathe_wallet';   /* Testversion: eigener Speicher, getrennt von der Klassenversion */
var memWallet = { balance: 0, games: [], records: {} };   /* Reserve, falls der Browser-Speicher blockiert ist */
function readWallet() {
  try {
    var w = JSON.parse(localStorage.getItem(WALLET_KEY));
    if (w && typeof w === 'object') {
      memWallet = { balance: Math.max(0, Math.floor(Number(w.balance) || 0)), games: Array.isArray(w.games) ? w.games.slice() : [], records: (w.records && typeof w.records === 'object') ? w.records : {} };   /* records: Spiel-Rekorde, werden von den Trainern geschrieben */
    }
  } catch (e) {}
  return memWallet;
}
function writeWallet(w) {
  memWallet = w;
  try { localStorage.setItem(WALLET_KEY, JSON.stringify(w)); } catch (e) {}
}

/* Spiele im Shop. Preise in Cookies; Flappy Bird ist immer dabei. Neue Spiele hier eintragen
   (und im Trainer unter GAMES_ORDER / GAMES). */
var SHOP = [
  { id: 'flappy', icon: '🐦', name: 'Flappy Bird', desc: 'Weiche den Röhren aus.', price: 0 },
  { id: 'snake',  icon: '🐍', name: 'Snake',       desc: 'Friss Äpfel und werde länger, ohne dich selbst oder die Wand zu berühren.', price: 3 },
  { id: 'tower',  icon: '🏠', name: 'Stapelturm',  desc: 'Lass die Steine fallen und baue ein möglichst hohes Haus.', price: 5 },
  { id: 'more',   icon: '✨', name: 'Weitere Spiele', desc: 'Folgen bald.', soon: true }
];
var sureId = null, sureTimer = 0;

function showCookies() {
  document.getElementById('cookies').textContent = readWallet().balance;
  if (!document.getElementById('shopOv').hidden) renderShop();
}
function renderShop() {
  var w = readWallet();
  document.getElementById('shopBal').textContent = w.balance;
  var list = document.getElementById('shopList');
  list.innerHTML = '';
  SHOP.forEach(function (g) {
    var owned = g.price === 0 || w.games.indexOf(g.id) >= 0;
    var row = document.createElement('div');
    row.className = 'item' + (g.soon ? ' soon' : '');
    var txt = '<div class="ic">' + g.icon + '</div><div class="txt"><div class="nm"></div><div class="ds"></div></div>';
    row.innerHTML = txt;
    row.querySelector('.nm').textContent = g.name;
    var rec = Math.max(0, parseInt(w.records && w.records[g.id]) || 0);
    row.querySelector('.ds').textContent = g.desc + (rec > 0 ? ' · Dein Rekord: ' + rec : '');
    if (g.soon) {
      /* kein Button */
    } else if (owned) {
      var o = document.createElement('span'); o.className = 'own'; o.textContent = '✓ Freigeschaltet'; row.appendChild(o);
    } else {
      var b = document.createElement('button'); b.type = 'button';
      var can = w.balance >= g.price;
      b.disabled = !can;
      if (sureId === g.id && can) { b.textContent = 'Wirklich kaufen?'; b.className = 'sure'; }
      else b.textContent = g.price + ' 🍪 kaufen';
      b.addEventListener('click', function () { buy(g); });
      row.appendChild(b);
    }
    list.appendChild(row);
  });
}
function buy(g) {
  var w = readWallet();
  if (w.games.indexOf(g.id) >= 0 || w.balance < g.price) { sureId = null; renderShop(); return; }
  if (sureId !== g.id) {   /* erst Sicherheitsfrage (confirm() geht in manchen Ansichten nicht) */
    sureId = g.id; clearTimeout(sureTimer);
    sureTimer = setTimeout(function () { sureId = null; renderShop(); }, 4000);
    renderShop(); return;
  }
  clearTimeout(sureTimer); sureId = null;
  w.balance -= g.price; w.games.push(g.id);
  writeWallet(w);
  showCookies();
}
function openShop() {
  document.getElementById('shopOv').hidden = false;
  renderShop();
  document.getElementById('shopClose').focus();
}
function closeShop() {
  document.getElementById('shopOv').hidden = true;
  sureId = null;
  if (location.hash === '#shop') { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; } }
  document.getElementById('walletBtn').focus();
}
document.getElementById('walletBtn').addEventListener('click', openShop);
document.getElementById('shopClose').addEventListener('click', closeShop);
document.getElementById('shopOv').addEventListener('click', function (e) { if (e.target === this) closeShop(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !document.getElementById('shopOv').hidden) closeShop(); });
function checkHash() { if (location.hash === '#shop') openShop(); }
window.addEventListener('hashchange', checkHash);
/* Testversion: alles freigeschaltet, mindestens 50 Cookies */
(function () {
  var w = readWallet();
  SHOP.forEach(function (g) { if (!g.soon && g.price > 0 && w.games.indexOf(g.id) < 0) w.games.push(g.id); });
  if (w.balance < 50) w.balance = 50;
  writeWallet(w);
})();
showCookies();
checkHash();
window.addEventListener('storage', showCookies);
window.addEventListener('focus', showCookies);
document.addEventListener('visibilitychange', showCookies);
var grid = document.getElementById('grid');
LU.forEach(function (x) {
  var el = document.createElement(x.tool ? 'a' : 'div');
  el.className = 'card' + (x.tool ? '' : ' off');
  if (x.tool) el.href = x.d + '/';
  el.innerHTML = '<div class="lu">LU ' + x.k + '</div><div class="name">' + x.n +
    '</div><div class="tool">' + (x.tool ? x.tool : 'folgt') + '</div>';
  grid.appendChild(el);
});
</script>
</body>
</html>
